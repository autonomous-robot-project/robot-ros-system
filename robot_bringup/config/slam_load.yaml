# SLAM as computational load of V-08 C1: slam_toolbox processes /scan, but nobody consumes its
# map and it publishes no transform; the planner keeps planning over M (ADR 040).
# The launch loads the package defaults, then slam.yaml, then this file: the last one wins.
# Criticality: T2, product (robot-docs codigo.md).

slam_toolbox:
  ros__parameters:
    # Own frame and topic, consumed by nobody (ADR 040): map -> odom stays the static identity
    map_frame: "slam_map"
    map_name: "/slam_map"
    transform_publish_period: 0.0  # s; 0 = never publishes slam_map -> odom
