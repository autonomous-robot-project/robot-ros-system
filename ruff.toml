# Lint and format of every package in this repository (Ruff 0.17.2).
# Follows the ROS 2 style of ament_lint: 99 columns, single quotes, pep257 docstrings.

line-length = 99
target-version = "py312"

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "D",       # docstring style
    "I",       # import order
    "B",       # likely bugs (bugbear)
    "N",       # naming
    "Q",       # quotes
    "UP",      # syntax of the target Python version
]
# Missing docstrings are allowed, as in ament_pep257: a docstring is written where it explains
# something, not for every function.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[lint.pydocstyle]
convention = "pep257"

[lint.isort]
# Google style, as flake8-import-order in ament_flake8: `import x` and `from x import y`
# sorted together by module name.
force-sort-within-sections = true

[lint.flake8-quotes]
inline-quotes = "single"

[format]
quote-style = "single"
